name: Release

# Publishes one package per pushed tag `<package>@<version>` (e.g. oxlint-plugin-errorset@0.2.0)
# with npm trusted publishing (OIDC) and provenance. Only the maintainer pushes tags.
# Versions already on npm are skipped, so pushing historical tags is harmless.

on:
  push:
    tags: ["oxlint-plugin-*@*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%@*}"
          version="${TAG##*@}"
          dir="packages/${name#oxlint-plugin-}"
          test -f "$dir/package.json" || { echo "::error::no package directory for $name"; exit 1; }
          actual="$(node -p "require('./$dir/package.json').version")"
          pkgname="$(node -p "require('./$dir/package.json').name")"
          if [ "$pkgname" != "$name" ] || [ "$actual" != "$version" ]; then
            echo "::error::tag $TAG does not match $dir/package.json ($pkgname@$actual)"; exit 1
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - if: steps.pkg.outputs.skip == 'false'
        run: bun install --frozen-lockfile
      - if: steps.pkg.outputs.skip == 'false'
        run: bun run gate
      - if: steps.pkg.outputs.skip == 'false'
        name: Publish with provenance
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --provenance --access public
